# Console-friendly log4j config for the verification tools (screenshot nodes).
# The normal src/main/resources/log4j.properties prints INFO + SQL DEBUG to the
# console, which floods the ~45-line console window and hides the evidence the
# tools print with System.out. Here everything is sent to a NullAppender except
# the AOP aspect and the interceptors, whose [AOP REQ]/[REQ]/[RESP] lines ARE
# part of the experiment evidence and therefore keep a console appender.
#
# Used by docs/scripts/shots/runtool.bat via
#   -Dlog4j.configuration=log4j-shot.properties
# (docs/ is prepended to the classpath so log4j finds this file as a resource).

log4j.rootLogger=INFO, shotNull
log4j.appender.shotNull=org.apache.log4j.varia.NullAppender

# Keep the request-log aspect / interceptors on screen
log4j.appender.shotConsole=org.apache.log4j.ConsoleAppender
log4j.appender.shotConsole.layout=org.apache.log4j.PatternLayout
log4j.appender.shotConsole.layout.ConversionPattern=%d{HH:mm:ss} [%p] %c{1} - %m%n

log4j.logger.com.lab.emp.aspect=INFO, shotConsole
log4j.additivity.com.lab.emp.aspect=false
log4j.logger.com.lab.emp.interceptor=INFO, shotConsole
log4j.additivity.com.lab.emp.interceptor=false
# 任务 6.5 的 [TX-n] 现象日志也是证据，保留
log4j.logger.com.lab.emp.service.impl.TxVerifyServiceImpl=INFO, shotConsole
log4j.additivity.com.lab.emp.service.impl.TxVerifyServiceImpl=false

# Silence the noisy infrastructure loggers
log4j.logger.com.lab.emp.mapper=OFF
log4j.logger.com.baomidou=OFF
log4j.logger.org.springframework=OFF
log4j.logger.com.alibaba.druid=OFF
log4j.logger.org.hibernate.validator=OFF
